# HiveWorks — основная конфигурация
# Все тексты находятся в messages_ru.yml / messages_en.yml

# Язык сообщений: ru | en
locale: ru

storage:
  # SQLITE | YAML
  type: SQLITE
  # путь относительно папки плагина
  sqlite-file: data/hiveworks.db

production:
  # минут на 1 уровень мёда при 3 пчёлах и 3+ видах цветов
  base-minutes-per-level: 4.0
  # сколько часов офлайна учитывать
  offline-cap-hours: 8
  # множитель ночью и в дождь
  night-rain-multiplier: 0.5
  # период пакетного тика ульев
  tick-interval-seconds: 20
  # период автосохранения в БД
  save-interval-seconds: 300

quality:
  weights:
    flowers: 0.60
    frames: 0.25
    purity: 0.15
  good-threshold: 0.35
  elite-threshold: 0.60
  legendary-threshold: 0.85

limits:
  hives-per-chunk: 4
  hives-per-player: 32

resource-pack:
  # OFF | URL | EMBEDDED
  mode: OFF
  url: ""
  # порт встроенного HTTP-сервера
  embedded-port: 8123
  # внешний адрес сервера для EMBEDDED, например http://play.example.com:8123
  public-url: ""
  require: false
  prompt: "HiveWorks"

visuals:
  # кастомная модель улья поверх ванильного блока (нужен ресурспак)
  custom-hive-model: false

features:
  pollination: true
  mead-buffs: true
  fox-raider: true
  wild-swarm: true
  guard: true

wild-swarm:
  check-seconds: 60
  cooldown-minutes: 10
  lifetime-minutes: 10
  max-bees: 6

queen:
  # без матки производство останавливается
  required: true
  max-cycles: 40
  royal-jelly-cycles: 20
  max-cycles-cap: 80

guard:
  bees: 2
  radius: 8
  cooldown-seconds: 30
  lifetime-seconds: 60
  attack-creepers: false
  interval-seconds: 2

raid:
  interval-seconds: 60
  chance: 0.25
  bear-chance: 0.20
  cooldown-minutes: 15
  lifetime-seconds: 60
  max-active: 3
  distance: 8
  fox-steal: 1
  bear-steal: 3

apiary:
  radius: 10
  min-hives: 3
  min-flowers: 3
  min-fences: 8
  speed-bonus: 1.15
  quality-bonus: 0.05

worlds:
  blacklist: []
