help:
  - "<gold>HiveWorks</gold> <gray>— cozy beekeeping</gray>"
  - "<gray>1. Catch a bee with a net or: <white>/hive admin give bee forest 3</white></gray>"
  - "<gray>2. Place a hive and right-click it with an empty hand.</gray>"
  - "<gray>3. Click a bee on a comb slot (second row).</gray>"
  - "<gray>4. The first bee becomes the queen, the rest are workers.</gray>"
  - "<gray>5. Insert frames into slots 18–21.</gray>"
  - "<gray>6. Plant 3+ flower species within 8 blocks.</gray>"
  - "<gray>7. Wait ~4 minutes per honey level and harvest.</gray>"
  - "<gray>Modes: apiary, pollination, collection, guard.</gray>"
  - "<gray>/hive atlas, /hive apiary create [name], /hive pack.</gray>"
  - "<gray>/hive admin — administration.</gray>"
  - "<gray>/hive top — top beekeepers.</gray>"
  - "<gray>/hive ritual — Queen ritual (tier IV, night, candles).</gray>"

