# Рамки улья.
# max-uses: сборов до поломки.
# max-honey: прибавка к максимуму мёда.
# speed: прибавка к скорости производства (0.25 = +25%).
# quality-weight: вклад в оценку качества (0..1).
# quality-bonus: прямая прибавка к итоговому score.
# sting-reduction: снижение шанса укуса (0..1).

