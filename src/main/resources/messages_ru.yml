help:
  - "<gold>HiveWorks</gold> <gray>— уютное пчеловодство</gray>"
  - "<gray>1. Поймайте пчелу сачком или: <white>/hive admin give bee forest 3</white></gray>"
  - "<gray>2. Поставьте улей и нажмите ПКМ пустой рукой.</gray>"
  - "<gray>3. Кликните пчелой по слоту-соте (второй ряд).</gray>"
  - "<gray>4. Первая пчела станет маткой, остальные — работницы.</gray>"
  - "<gray>5. Вставьте рамки в слоты 18–21.</gray>"
  - "<gray>6. Посадите 3+ вида цветов в радиусе 8.</gray>"
  - "<gray>7. Ждите мёд ~4 мин/уровень и собирайте кнопкой.</gray>"
  - "<gray>Режимы: пасека, опыление, сбор, охрана.</gray>"
  - "<gray>/hive atlas — атлас, /hive apiary create [имя] — пасека.</gray>"
  - "<gray>/hive pack — ресурспак, /hive admin — администрирование.</gray>"
  - "<gray>/hive top — топ пасечников.</gray>"
  - "<gray>/hive ritual — ритуал Матки (IV тир, ночь, свечи).</gray>"

